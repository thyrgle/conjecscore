<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- A Golomb ruler of order 5 (marks 0, 1, 4, 9, 11) drawn to scale: 1 unit = 16 px. -->
<svg
   width="216"
   height="64"
   viewBox="0 0 216 64"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Ruler body -->
  <rect x="10" y="20" width="196" height="24" rx="2" ry="2"
        fill="#fde68a" stroke="#78350f" stroke-width="1.5" />
  <!-- Minor graduations at every integer position 0..11 -->
  <g stroke="#78350f" stroke-width="1">
    <line x1="20" y1="20" x2="20" y2="28" />
    <line x1="36" y1="20" x2="36" y2="28" />
    <line x1="52" y1="20" x2="52" y2="28" />
    <line x1="68" y1="20" x2="68" y2="28" />
    <line x1="84" y1="20" x2="84" y2="28" />
    <line x1="100" y1="20" x2="100" y2="28" />
    <line x1="116" y1="20" x2="116" y2="28" />
    <line x1="132" y1="20" x2="132" y2="28" />
    <line x1="148" y1="20" x2="148" y2="28" />
    <line x1="164" y1="20" x2="164" y2="28" />
    <line x1="180" y1="20" x2="180" y2="28" />
    <line x1="196" y1="20" x2="196" y2="28" />
  </g>
  <!-- Marked points of the Golomb ruler: 0, 1, 4, 9, 11 -->
  <g stroke="#7f1d1d" stroke-width="2.5" stroke-linecap="round">
    <line x1="20" y1="20" x2="20" y2="44" />
    <line x1="36" y1="20" x2="36" y2="44" />
    <line x1="84" y1="20" x2="84" y2="44" />
    <line x1="164" y1="20" x2="164" y2="44" />
    <line x1="196" y1="20" x2="196" y2="44" />
  </g>
  <!-- Labels for the marked points -->
  <g font-family="sans-serif" font-size="10" text-anchor="middle" fill="#7f1d1d">
    <text x="20" y="58">0</text>
    <text x="36" y="58">1</text>
    <text x="84" y="58">4</text>
    <text x="164" y="58">9</text>
    <text x="196" y="58">11</text>
  </g>
</svg>
